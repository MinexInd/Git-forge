
name: Build GitForge APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug and Release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GitForge-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk GitForge-release-unsigned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitForge-APKs
          path: |
            GitForge-debug.apk
            GitForge-release-unsigned.apk

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            GitForge-debug.apk \
            GitForge-release-unsigned.apk \
            --clobber
